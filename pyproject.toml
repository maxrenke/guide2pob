[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guide2pob"
version = "0.1.0"
description = "Convert Mobalytics and Maxroll PoE build guides into Path of Building import codes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maxwell Renke" }]
keywords = ["path-of-exile", "poe2", "path-of-building", "mobalytics", "maxroll"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
analyze = []

[project.scripts]
guide2pob = "guide2pob.cli:main"
guide2pob-sync = "guide2pob.sync:main"
guide2pob-meta = "guide2pob.meta:main"

[project.urls]
Homepage = "https://github.com/maxrenke/guide2pob"
Issues = "https://github.com/maxrenke/guide2pob/issues"

[tool.setuptools]
packages = ["guide2pob"]
